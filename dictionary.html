<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionary — Pokémon Fan Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #E63946;
      --yellow: #FFD166;
      --blue:   #118AB2;
      --dark:   #1a1a2e;
      --cream:  #FFF8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans JP", sans-serif;
      background-color: var(--cream);
      color: var(--dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* HEADER */
    header {
      position: relative;
      background: var(--red);
      overflow: hidden;
    }
    header::after {
      content: "";
      position: absolute; right: -80px; top: 50%; transform: translateY(-50%);
      width: 220px; height: 220px; border-radius: 50%;
      background: conic-gradient(#f0f0f0 0deg 180deg, #222 180deg 360deg);
      opacity: 0.12; border: 12px solid rgba(255,255,255,0.15);
    }
    .header-inner {
      max-width: 900px; margin: auto;
      padding: 28px 20px 18px; position: relative; z-index: 2;
    }
    header h1 {
      font-family: "Dela Gothic One", sans-serif;
      font-size: 38px; letter-spacing: 3px;
      color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); line-height: 1;
    }
    header h1 span { color: var(--yellow); }

    nav { display: flex; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
    nav a {
      color: rgba(255,255,255,0.75); text-decoration: none;
      font-size: 12px; font-weight: 700; letter-spacing: 2px;
      padding: 5px 14px;
      border: 1.5px solid rgba(255,255,255,0.3); border-radius: 999px;
      transition: all 0.2s;
    }
    nav a:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.7); }
    nav a.active { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.8); }

    .redline {
      height: 5px;
      background: linear-gradient(90deg, var(--red), var(--yellow), var(--blue));
    }

    /* CONTAINER */
    .container {
      max-width: 900px; margin: auto;
      padding: 40px 20px 64px;
      position: relative; z-index: 1;
    }

    /* SECTION HEADER */
    .section-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 24px;
    }
    .section-header h2 {
      font-family: "Dela Gothic One", sans-serif;
      font-size: 18px; letter-spacing: 1px; white-space: nowrap;
    }
    .section-line {
      flex: 1; height: 2px;
      background: linear-gradient(to right, #e0e0e0, transparent);
      border-radius: 999px;
    }

    /* FILTER TABS */
    .filter-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;
    }
    .filter-btn {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 12px; font-weight: 700; letter-spacing: 1px;
      padding: 6px 16px; border-radius: 999px; cursor: pointer;
      border: 2px solid #e0e0e0;
      background: #fff; color: #aaa;
      transition: all 0.18s;
    }
    .filter-btn:hover { border-color: var(--red); color: var(--red); }
    .filter-btn.active {
      background: var(--red); color: #fff; border-color: var(--red);
    }

    /* SEARCH */
    .search-wrap {
      margin-bottom: 20px; position: relative;
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 16px 11px 40px;
      border: 2px solid #eee; border-radius: 12px;
      font-family: "Noto Sans JP", sans-serif;
      font-size: 14px; background: #fff; color: var(--dark);
      outline: none; transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--red); }
    .search-wrap input::placeholder { color: #ccc; }
    .search-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 16px; pointer-events: none;
    }

    /* COUNT */
    .result-count {
      font-size: 12px; color: #bbb; margin-bottom: 16px;
    }
    .result-count span { color: var(--red); font-weight: 700; }

    /* TABLE */
    .dict-table {
      width: 100%;
      border-collapse: collapse;
    }

    .dict-table thead tr {
      background: var(--dark);
    }
    .dict-table thead th {
      font-family: "Dela Gothic One", sans-serif;
      font-size: 11px; letter-spacing: 2px;
      color: #fff; padding: 12px 16px;
      text-align: left; white-space: nowrap;
    }
    .dict-table thead th:first-child { border-radius: 12px 0 0 0; }
    .dict-table thead th:last-child  { border-radius: 0 12px 0 0; }

    .dict-table tbody tr {
      background: #fff;
      border-bottom: 2px solid #f0f0f0;
      transition: all 0.15s;
      animation: fadeUp 0.3s ease both;
    }
    .dict-table tbody tr:hover {
      background: #fff5f5;
      transform: translateX(3px);
    }
    .dict-table tbody tr:last-child { border-bottom: none; }
    .dict-table tbody tr:last-child td:first-child { border-radius: 0 0 0 12px; }
    .dict-table tbody tr:last-child td:last-child  { border-radius: 0 0 12px 0; }

    .dict-table td {
      padding: 14px 16px;
      font-size: 13px; vertical-align: middle;
    }

    .td-ja {
      font-weight: 700; color: var(--dark);
      font-size: 14px; white-space: nowrap;
    }
    .td-en {
      color: var(--blue); font-weight: 700;
      font-style: italic; white-space: nowrap;
    }
    .td-meaning { color: #555; line-height: 1.6; }

    /* CATEGORY BADGE */
    .cat-badge {
      display: inline-block;
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    }
    .cat-battle  { background: #FEE8E8; color: var(--red); }
    .cat-go      { background: #E8F4FD; color: var(--blue); }
    .cat-unite   { background: #FFF8E1; color: #B8860B; }
    .cat-general { background: #F0F0F0; color: #666; }

    /* TABLE WRAPPER (scroll on mobile) */
    .table-wrap {
      background: #fff;
      border-radius: 14px;
      border: 2px solid #eee;
      box-shadow: 4px 4px 0 #e0e0e0;
      overflow: hidden;
      overflow-x: auto;
    }

    /* EMPTY */
    .empty {
      text-align: center; padding: 48px 20px;
      color: #ccc; font-size: 14px; display: none;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* FOOTER */
    footer {
      text-align: center; padding: 30px 20px;
      border-top: 2px solid #eee;
      font-size: 12px; color: #aaa;
      position: relative; z-index: 1;
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1><span>Pokémon</span> Fan Log</h1>
    <nav>
      <a href="index.html">HOME</a>
      <a href="blog.html">BLOG</a>
      <a href="gallery.html">GALLERY</a>
      <a href="about.html">ABOUT</a>
    </nav>
  </div>
</header>
<div class="redline"></div>

<div class="container">

  <div class="section-header">
    <h2>Dictionary</h2>
    <div class="section-line"></div>
  </div>

  <!-- 検索 -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="日本語・英語・意味で検索…" oninput="applyFilter()">
  </div>

  <!-- フィルタータブ -->
  <div class="filter-bar">
    <button class="filter-btn active" data-cat="all"    onclick="setFilter('all',    this)">すべて</button>
    <button class="filter-btn"        data-cat="battle" onclick="setFilter('battle', this)">ポケモンバトル</button>
    <button class="filter-btn"        data-cat="go"     onclick="setFilter('go',     this)">ポケモンGO</button>
    <button class="filter-btn"        data-cat="unite"  onclick="setFilter('unite',  this)">ユナイト</button>
    <button class="filter-btn"        data-cat="general" onclick="setFilter('general', this)">ゲーム全般</button>
  </div>

  <div class="result-count" id="resultCount"></div>

  <!-- テーブル -->
  <div class="table-wrap">
    <table class="dict-table" id="dictTable">
      <thead>
        <tr>
          <th>日本語</th>
          <th>English</th>
          <th>意味</th>
          <th>カテゴリー</th>
        </tr>
      </thead>
      <tbody id="dictBody">
        <!-- JSで描画 -->
      </tbody>
    </table>
    <div class="empty" id="emptyMsg">該当する用語が見つかりませんでした。</div>
  </div>

</div>

<footer>
  <p>⚪ © Pokémon Fan Log — 好きを置いておく場所</p>
</footer>

<script>
  /* ============================================================
     ▼▼▼ 用語はここに追加してください ▼▼▼
     cat: "battle" / "go" / "unite" / "general"
  ============================================================ */
  const WORDS = [
    { ja: "効果ばつぐん",     en: "super effective",        meaning: "相手のタイプに対して有利なわざを使い、大きなダメージを与えること",     cat: "battle"  },
    { ja: "効果いまひとつ",   en: "not very effective",     meaning: "相手のタイプに対して不利なわざを使い、ダメージが半減すること",         cat: "battle"  },
    { ja: "こうかがない",     en: "no effect",              meaning: "相手のタイプに対してダメージが0になること",                             cat: "battle"  },
    { ja: "ひんし",           en: "fainted",                meaning: "HPが0になってポケモンが戦闘不能になった状態",                           cat: "battle"  },
    { ja: "どうぐ",           en: "held item / item",       meaning: "ポケモンに持たせる道具。バトルで効果を発揮するものが多い",             cat: "battle"  },
    { ja: "とくせい",         en: "ability",                meaning: "各ポケモンが持つ固有の特性。バトルや野生での行動に影響する",           cat: "battle"  },
    { ja: "努力値（どりょくち）", en: "EV (Effort Value)",  meaning: "バトルで強化できるステータスの隠し数値。トレーニングで上げる",         cat: "battle"  },
    { ja: "個体値（こたいち）", en: "IV (Individual Value)", meaning: "各ポケモンが生まれつき持つステータスの才能値。31が最大",             cat: "battle"  },
    { ja: "すばやさ",         en: "Speed",                  meaning: "行動順を決めるステータス。高いほど先手を取りやすい",                   cat: "battle"  },
    { ja: "きあいだめ",       en: "Focus Energy",           meaning: "急所に当たりやすくなるわざ。クリティカル率が上昇する",               cat: "battle"  },

    { ja: "CP",               en: "Combat Power",           meaning: "ポケモンの強さを示す総合的な数値。レベルやIVで変化する",             cat: "go"      },
    { ja: "スターダスト",     en: "Stardust",               meaning: "ポケモンを強化するために使うリソース。捕獲や孵化で入手",             cat: "go"      },
    { ja: "アメ",             en: "Candy",                  meaning: "ポケモンの強化・進化に使う素材。種族ごとに別々に管理される",         cat: "go"      },
    { ja: "レイド",           en: "Raid Battle",            meaning: "ジムに出現するボスポケモンと複数人で戦うバトル",                     cat: "go"      },
    { ja: "タマゴ",           en: "Egg",                    meaning: "一定距離を歩くと孵化するアイテム。中のポケモンはランダム",           cat: "go"      },
    { ja: "フィールドリサーチ", en: "Field Research",       meaning: "ポケストップで入手できる日替わりのミッション",                       cat: "go"      },
    { ja: "シャドウポケモン",  en: "Shadow Pokémon",        meaning: "ロケット団に捕まっていたポケモン。攻撃力が上がるが防御が下がる",     cat: "go"      },

    { ja: "ゴール",           en: "Score / Goal",           meaning: "エオスエナジーをゴールに入れてポイントを獲得すること",               cat: "unite"   },
    { ja: "ファームポイント",  en: "Farm Point / Aeos Coin", meaning: "マッチで獲得できる通貨。アイテムの購入に使う",                     cat: "unite"   },
    { ja: "バトルアイテム",   en: "Battle Item",            meaning: "バトル中に使用できるアイテム。回復・ダッシュなど種類が豊富",         cat: "unite"   },
    { ja: "ユナイトわざ",     en: "Unite Move",             meaning: "ゲージが溜まると使える強力な必殺技。試合の流れを変えられる",         cat: "unite"   },
    { ja: "ジャングル",       en: "Jungle",                 meaning: "マップ中央エリアで野生ポケモンを倒してレベルを上げる動き",           cat: "unite"   },

    { ja: "セーブ",           en: "Save",                   meaning: "ゲームの進行状況を記録すること",                                     cat: "general" },
    { ja: "レベルアップ",     en: "Level Up",               meaning: "経験値を貯めてポケモンのレベルが上がること",                         cat: "general" },
    { ja: "しんか",           en: "Evolution",              meaning: "特定の条件を満たしてポケモンが別の姿に変わること",                   cat: "general" },
    { ja: "タマゴわざ",       en: "Egg Move",               meaning: "タマゴから生まれた際にのみ覚えられる特殊なわざ",                     cat: "general" },
    { ja: "はかせ",           en: "Professor",              meaning: "各地方に存在するポケモン研究者。ゲームの案内役",                     cat: "general" },
  ];
  /* ▲▲▲ ここまで ▲▲▲ */

  const CAT_LABEL = {
    battle:  "ポケモンバトル",
    go:      "ポケモンGO",
    unite:   "ユナイト",
    general: "ゲーム全般",
  };
  const CAT_CLASS = {
    battle:  "cat-battle",
    go:      "cat-go",
    unite:   "cat-unite",
    general: "cat-general",
  };

  let currentCat = "all";

  function setFilter(cat, btn) {
    currentCat = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter();
  }

  function applyFilter() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const body = document.getElementById('dictBody');
    const empty = document.getElementById('emptyMsg');
    const countEl = document.getElementById('resultCount');

    const filtered = WORDS.filter(w => {
      const catOk = currentCat === "all" || w.cat === currentCat;
      const searchOk = !q ||
        w.ja.toLowerCase().includes(q) ||
        w.en.toLowerCase().includes(q) ||
        w.meaning.toLowerCase().includes(q);
      return catOk && searchOk;
    });

    body.innerHTML = '';
    filtered.forEach((w, i) => {
      const tr = document.createElement('tr');
      tr.style.animationDelay = (i * 0.03) + 's';
      tr.innerHTML = `
        <td class="td-ja">${w.ja}</td>
        <td class="td-en">${w.en}</td>
        <td class="td-meaning">${w.meaning}</td>
        <td><span class="cat-badge ${CAT_CLASS[w.cat]}">${CAT_LABEL[w.cat]}</span></td>
      `;
      body.appendChild(tr);
    });

    empty.style.display = filtered.length === 0 ? 'block' : 'none';
    countEl.innerHTML = `<span>${filtered.length}</span> 件`;
  }

  applyFilter();
</script>

</body>
</html>
